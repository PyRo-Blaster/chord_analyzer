[project]
name = "jca-api"
version = "0.1.0"
description = "Web API for the Jazz Chord Analyzer"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "jca-core",
    "jca-pipeline",
    "python-multipart==0.0.33",
    "uvicorn==0.54.0",
]

[project.scripts]
jca-serve = "jca_api.serve:main"

[tool.uv.sources]
jca-core = { path = "../core", editable = true }
jca-pipeline = { path = "../pipeline", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28",
    "numpy>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "soundfile>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jca_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["jca_api"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
