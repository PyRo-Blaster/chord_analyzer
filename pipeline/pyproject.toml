[project]
name = "jca-pipeline"
version = "0.1.0"
description = "Command-line analysis pipeline for the Jazz Chord Analyzer"
requires-python = ">=3.12"
dependencies = [
    "jca-core",
    "numpy>=2.0",
    "pydantic>=2.11",
    "soundfile>=0.12",
]

[project.scripts]
jca-analyze = "jca_pipeline.cli:main"

[tool.uv.sources]
jca-core = { path = "../core", editable = true }

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jca_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not model'"
markers = ["model: runs a real model in its worker environment (slow, not in CI)"]

[tool.coverage.run]
source = ["jca_pipeline"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
