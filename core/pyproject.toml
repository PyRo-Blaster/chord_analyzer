[project]
name = "jca-core"
version = "0.1.0"
description = "Model-free logic for the Jazz Chord Analyzer"
requires-python = ">=3.12"
dependencies = [
    "mir_eval>=0.8",
    "numpy>=2.0",
    "pydantic>=2.11",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jca_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["jca_core"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
